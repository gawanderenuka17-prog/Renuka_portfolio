<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Renuka Gawande • Portfolio</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: Poppins;
            margin: 0;
            background: #f9fafb
        }

        header {
            background: linear-gradient(270deg, #6366f1, #22c55e);
            color: #fff;
            padding: 60px;
            text-align: center
        }

        section {
            padding: 40px;
            max-width: 1100px;
            margin: auto
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px
        }

        .card {
            background: #fff;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1)
        }

        .btn {
            display: inline-block;
            margin-top: 10px;
            padding: 8px 14px;
            background: #22c55e;
            color: #000;
            text-decoration: none;
            border-radius: 6px
        }

        h2 {
            color: #6366f1
        }

        .btn-ios {
            background: #000;
            color: #fff;
        }

        .btn-android {
            background: #22c55e;
            color: #000;
        }
    </style>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbzoTAKs5oUPokKDZWWBn0YjO7ORHFxE6ie294XnoqtxoCyXNKmvF4-O8v3Z56tXiRxi/exec";

        // FETCH DATA
        async function fetchData() {
            try {
                const res = await fetch(API_URL);
                const data = await res.json();

                renderApps(data);
                renderBlogs(data);
                renderData(data);
                renderDashboard(data);
                showBlogDetail(data);
                showDataDetail(data);
                showDashboardDetail(data);

            } catch (err) {
                console.error(err);
                document.body.innerHTML = "<h2 style='color:red;text-align:center'>API Error</h2>";
            }
        }

        const cvItem = data.find(p => p.type && p.type.toLowerCase() === 'cv');

          if(cvItem){
              document.getElementById("cvBtn").href = cvItem.link;
              }

        // APPS
        function renderApps(list) {
            const grid = document.getElementById("appsGrid");
            const apps = list.filter(x => x.type === "ios" || x.type === "android");

            grid.innerHTML = "";
            apps.forEach(a => {
                grid.innerHTML += `
      <div class="card">
        <h3>${a.title}</h3>
        <p>${a.description}</p>
        <a class="btn" href="${a.link}" target="_blank">Open</a>
      </div>`;
            });
        }

        // BLOG LIST
        function renderBlogs(list) {
            const grid = document.getElementById("blogGrid");
            const blogs = list.filter(x => x.type === "blog");

            grid.innerHTML = "";
            blogs.forEach(b => {
                grid.innerHTML += `
      <div class="card">
        <h3>${b.title}</h3>
        <p>${b.description}</p>
        <a class="btn" href="?blog=${encodeURIComponent(b.link)}">Read</a>
      </div>`;
            });
        }

        // DATA LIST
        function renderData(list) {
            const grid = document.getElementById("dataGrid");
            const data = list.filter(x => x.type === "dataanalysis");

            grid.innerHTML = "";
            data.forEach(d => {
                grid.innerHTML += `
      <div class="card">
        <h3>${d.title}</h3>
        <p>${d.description}</p>
        <a class="btn" href="?data=${encodeURIComponent(d.title)}">View</a>
      </div>`;
            });
        }

        // Dashboard LIST
        function renderDashboard(list) {
            const grid = document.getElementById("dashboardGrid");
            const data = list.filter(x => x.type === "dashboard");

            grid.innerHTML = "";
            data.forEach(d => {
                grid.innerHTML += `
      <div class="card">
        <h3>${d.title}</h3>
        <p>${d.description}</p>
        <a class="btn" href="?data=${encodeURIComponent(d.title)}">View</a>
      </div>`;
            });
        }

        // BLOG DETAIL
        function showBlogDetail(list) {
            const id = new URLSearchParams(window.location.search).get("blog");
            if (!id) return;

            const blog = list.find(x => encodeURIComponent(x.title) === id);
            if (!blog) return;

            document.body.innerHTML = `
    <section>
      <h1>${blog.title}</h1>
      <p>${blog.description}</p>
    </section>`;
        }

        // DATA DETAIL
        function showDataDetail(list) {
            const id = new URLSearchParams(window.location.search).get("dataanalysis");
            if (!id) return;

            const item = list.find(x => encodeURIComponent(x.title) === id);
            if (!item) return;

            document.body.innerHTML = `
    <section>
      <h1>${item.title}</h1>
      <p>${item.description}</p>
      <a href="${item.link}" target="_blank">Open Dashboard</a>
    </section>`;
        }

        // Dashboard DETAIL
        function showDashboardDetail(list) {
            const id = new URLSearchParams(window.location.search).get("dataanalysis");
            if (!id) return;

            const item = list.find(x => encodeURIComponent(x.title) === id);
            if (!item) return;

            document.body.innerHTML = `
    <section>
      <h1>${item.title}</h1>
      <p>${item.description}</p>
      <a href="${item.link}" target="_blank">Open Dashboard</a>
    </section>`;
        }

        window.onload = fetchData;
    </script>
</head>

<body>

    <header>
        <h1>Renuka Gawande</h1>
        <p>Portfolio Dashboard</p>
            <div style="text-align:right">
  <a class="btn" id="cvBtn" target="_blank">📄 Download CV</a>
</div>
    </header>

    <section>
        <h2>📱 Apps </h2>
        <div class="grid" id="appsGrid"></div>
    </section>

    <section>
        <h2>📊 Data </h2>
        <div class="grid" id="dataGrid"></div>
    </section>

    <section>
        <h2>📊 Dashboard </h2>
        <div class="grid" id="dashboardGrid"></div>
    </section>

    <section>
        <h2>✍️ Blog </h2>
        <div class="grid" id="blogGrid"></div>
    </section>

</body>

</html>
